<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b2a">
<title>Live TV Player</title>
<style>
:root{--bg:#0e1b2a;--panel:#14283c;--line:#243d55;--text:#e6edf5;--dim:#8ea3b8;--accent:#f2b134;--bad:#e5726b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:360px 1fr;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
h1{font-size:18px;margin:0 0 2px;font-weight:700}
select,input,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
button{cursor:pointer;width:auto}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px}
.tabs button{flex:1;padding:6px}
.tabs button.on{background:var(--accent);color:#1b1405;border-color:var(--accent);font-weight:600}
#list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
#list li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover{background:#1a3350}
#list li.cur{background:#1d3a5a;box-shadow:inset 3px 0 var(--accent)}
#list li.dead{opacity:.4}
#list img{width:34px;height:34px;object-fit:contain;background:#fff1;border-radius:4px;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--dim);font-size:12px}
.fav{background:none;border:0;padding:2px 6px;font-size:18px;color:var(--dim)}
.fav.on{color:var(--accent)}
main{display:flex;flex-direction:column;min-width:0;padding:16px;gap:12px}
.stage{position:relative;flex:1;min-height:0;background:#000;border-radius:8px;overflow:hidden;display:grid;place-items:center}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--dim);pointer-events:none}
#msg.err{color:var(--bad)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#now{font-size:18px;font-weight:600;flex:1;min-width:160px}
#count{color:var(--dim);font-size:12px;padding:8px 14px}
html,body{height:100dvh}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
@media(max-width:800px){
 body{display:flex;flex-direction:column;overflow:hidden}
 main{order:1;padding:8px;gap:8px;flex:none}
 .stage{flex:none;aspect-ratio:16/9;width:100%}
 aside{order:2;flex:1;border-right:0;border-top:1px solid var(--line)}
 .top{padding:10px;gap:6px}
 h1{font-size:16px}
 select,input,button{padding:10px;font-size:16px}
 #now{font-size:15px}
 #list li{padding:10px 12px}
 .fav{font-size:24px;padding:4px 10px}
}
@media(max-width:800px) and (orientation:landscape){
 body{flex-direction:row}
 main{order:2;flex:1}aside{order:1;width:300px;flex:none;border-top:0;border-right:1px solid var(--line)}
 .stage{flex:1;aspect-ratio:auto}
}
/* ---------- Intro splash ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 35%,#1b3a5c 0%,#0e1b2a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s ease,visibility .7s}
#splash.hide{opacity:0;visibility:hidden}
.logo{position:relative;width:min(46vw,190px);aspect-ratio:1;border-radius:50%;animation:pop 1s cubic-bezier(.2,1.3,.4,1) both}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--accent);position:relative;z-index:2}
.logo::before,.logo::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.2s ease-out infinite}
.logo::after{animation-delay:1.1s}
#splash h2{margin:22px 0 4px;font-size:clamp(22px,6.5vw,30px);letter-spacing:.5px;animation:up .8s .5s both}
#splash .role{color:var(--accent);font-weight:600;font-size:clamp(14px,4vw,17px);animation:up .8s .8s both}
#splash .role2{color:var(--dim);font-size:clamp(13px,3.6vw,16px);margin-top:4px;animation:up .8s 1.1s both}
.ld{margin-top:34px;width:min(60vw,240px);height:4px;background:#ffffff1f;border-radius:4px;overflow:hidden;animation:up .6s 1.2s both}
.ld i{display:block;height:100%;width:0;background:var(--accent);animation:load 2.6s 1.2s ease-in-out forwards}
#splash small{margin-top:10px;color:var(--dim);animation:up .6s 1.3s both}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{to{width:100%}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const BASE="https://iptv-org.github.io/iptv/countries/";
const COUNTRIES={pk:"Pakistan",in:"India",us:"United States",gb:"United Kingdom",ae:"UAE",sa:"Saudi Arabia",bd:"Bangladesh",af:"Afghanistan",ir:"Iran",tr:"Turkey",ca:"Canada",au:"Australia",de:"Germany",fr:"France",es:"Spain",it:"Italy",ru:"Russia",cn:"China",jp:"Japan",kr:"South Korea",br:"Brazil",mx:"Mexico",eg:"Egypt",qa:"Qatar",lk:"Sri Lanka",np:"Nepal",id:"Indonesia",my:"Malaysia"};
const $=id=>document.getElementById(id);
const v=$("v"),list=$("list"),msg=$("msg");
let scanned=false,scanning=false,channels=[],shown=[],cur=-1,hls=null,favOnly=false;
let favs=[];try{favs=JSON.parse(localStorage.getItem("favs")||"[]")}catch(e){}
const dead=new Set();

for(const[c,n]of Object.entries(COUNTRIES))$("country").add(new Option(n,c));

function parse(text){
  const out=[],L=text.split(/\r?\n/);let info=null;
  for(const l of L){
    if(l.startsWith("#EXTINF")){
      info={name:(l.split(",").pop()||"").trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||"",group:(l.match(/group-title="([^"]*)"/)||[])[1]||""};
    }else if(info&&/^https?:/.test(l.trim())){
      info.url=l.trim();out.push(info);info=null;
    }
  }
  return out;
}
async function tryFetch(u){
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("Timed out")),15000));
  const job=(async()=>{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);const x=await r.text();if(!x.includes("#EXTINF"))throw new Error("Not a playlist");return x})();
  return Promise.race([job,timeout]);
}
async function loadPlaylist(url){
  $("count").textContent="Loading channels…";list.innerHTML="";
  const tries=[url];
  const m=url.match(/iptv-org\.github\.io\/iptv\/(.+)$/);
  if(m)tries.push("https://cdn.jsdelivr.net/gh/iptv-org/iptv@gh-pages/"+m[1],"https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/"+m[1]);
  tries.push("https://api.allorigins.win/raw?url="+encodeURIComponent(url),"https://corsproxy.io/?"+encodeURIComponent(url));
  let text=null,last="";
  for(const u of tries){
    try{$("count").textContent="Loading channels… ("+(tries.indexOf(u)+1)+"/"+tries.length+")";text=await tryFetch(u);break}catch(e){last=e.message}
  }
  if(text===null){
    channels=[];render();
    $("count").textContent="Could not load the playlist ("+last+"). Your network may block this site. Use 'Open M3U file' below, or try a VPN / different DNS (1.1.1.1).";
    return;
  }
  scanned=false;channels=parse(text);
  channels.sort((a,b)=>a.name.localeCompare(b.name));
  scanning=false;render();runScan();
}
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  channels=parse(await f.text());channels.sort((a,b)=>a.name.localeCompare(b.name));cur=-1;scanning=false;render();runScan();
};
function render(){
  const q=$("q").value.trim().toLowerCase();
  shown=channels.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q))&&(!favOnly||favs.includes(c.url))&&(!$("onlyok").checked||c.ok));
  list.innerHTML="";
  shown.forEach((c,i)=>{
    const li=document.createElement("li");
    if(i===cur)li.className="cur";
    if(dead.has(c.url))li.classList.add("dead");
    li.innerHTML='<img alt="" loading="lazy"><div class="nm"></div><button class="fav" aria-label="Favorite">★</button>';
    const img=li.querySelector("img");
    if(c.logo){img.src=c.logo;img.onerror=()=>img.style.visibility="hidden"}else img.style.visibility="hidden";
    li.querySelector(".nm").innerHTML=esc(c.name)+(c.group?'<div class="meta">'+esc(c.group)+'</div>':"");
    const f=li.querySelector(".fav");if(favs.includes(c.url))f.classList.add("on");
    f.onclick=e=>{e.stopPropagation();toggleFav(c.url)};
    li.onclick=()=>play(i);
    list.appendChild(li);
  });
  $("count").textContent=shown.length+" channels";
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function toggleFav(u){
  favs=favs.includes(u)?favs.filter(x=>x!==u):[...favs,u];
  try{localStorage.setItem("favs",JSON.stringify(favs))}catch(e){}
  const keep=shown[cur];render();cur=keep?shown.indexOf(keep):-1;mark();
}
function mark(){[...list.children].forEach((li,i)=>li.classList.toggle("cur",i===cur))}
function say(t,err){msg.textContent=t;msg.className=err?"err":"";msg.style.display=t?"grid":"none"}
function play(i){
  const c=shown[i];if(!c)return;
  cur=i;mark();$("now").textContent=c.name;say("Connecting…");
  if(hls){hls.destroy();hls=null}
  const fail=(why)=>{dead.add(c.url);list.children[i]&&list.children[i].classList.add("dead");say((why||"This channel is not responding right now.")+" Try another channel, or use 'Find working channels'.",true)};
  if(location.protocol==="https:"&&c.url.startsWith("http:")){return fail("This stream uses insecure http:// and browsers block it on secure pages. It works in VLC (use 'Save list for VLC').")}
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|\/hls|playlist/i.test(c.url)){
    hls=new Hls({maxBufferLength:20});
    hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{})});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){const code=d.response&&d.response.code;fail(code===0||(!code&&/manifestLoad/.test(d.details))?"The channel server is offline or does not allow web players (browser block).":code?"The channel returned error "+code+" (offline or region-locked).":"Playback error ("+d.details+").")}});
  }else{
    v.src=c.url;v.onerror=fail;v.play().catch(()=>{});
  }
}
v.addEventListener("playing",()=>say(""));
v.addEventListener("waiting",()=>say("Buffering…"));
$("country").onchange=()=>{cur=-1;loadPlaylist(BASE+$("country").value+".m3u")};
$("q").oninput=()=>{cur=-1;render()};
$("tAll").onclick=()=>{favOnly=false;$("tAll").classList.add("on");$("tFav").classList.remove("on");cur=-1;render()};
$("tFav").onclick=()=>{favOnly=true;$("tFav").classList.add("on");$("tAll").classList.remove("on");cur=-1;render()};
$("load").onclick=()=>{const u=$("custom").value.trim();if(u){cur=-1;loadPlaylist(u)}};
$("next").onclick=()=>play(Math.min(cur+1,shown.length-1));
$("prev").onclick=()=>play(Math.max(cur-1,0));
$("fs").onclick=()=>(v.requestFullscreen||v.webkitRequestFullscreen).call(v);

function probe(c){
  return new Promise(res=>{
    if(location.protocol==="https:"&&c.url.startsWith("http:"))return res(false);
    let done=false,h=null;const vid=document.createElement("video");vid.muted=true;
    const fin=ok=>{if(done)return;done=true;clearTimeout(t);try{h&&h.destroy()}catch(e){}vid.removeAttribute("src");vid.load();res(ok)};
    const t=setTimeout(()=>fin(false),9000);
    if(window.Hls&&Hls.isSupported()&&/\.m3u8|\/hls|playlist/i.test(c.url)){
      h=new Hls({manifestLoadingMaxRetry:0,levelLoadingMaxRetry:0,fragLoadingMaxRetry:0});
      h.loadSource(c.url);h.attachMedia(vid);
      h.on(Hls.Events.MANIFEST_PARSED,()=>fin(true));
      h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fin(false)});
    }else{vid.onloadedmetadata=()=>fin(true);vid.onerror=()=>fin(false);vid.src=c.url}
  });
}
const CK="okcache",TTL=3*3600*1000;
let okCache={};try{okCache=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){}
let tmr=null,found=0,doneN=0;
function renderKeep(){
  if(tmr)return;
  tmr=setTimeout(()=>{tmr=null;const keep=shown[cur];render();cur=keep?shown.indexOf(keep):-1;mark();status()},600);
}
function status(){
  if(scanning)$("count").textContent=shown.length+" working — checking "+doneN+"/"+channels.length;
  else $("count").textContent=$("onlyok").checked?(found+" working channels (of "+channels.length+")"):(shown.length+" channels");
}
async function runScan(){
  if(scanning||!channels.length)return;
  scanning=true;found=0;doneN=0;const now=Date.now(),mine=channels;
  mine.forEach(c=>{c.ok=!!(okCache[c.url]&&now-okCache[c.url]<TTL);if(c.ok)found++});
  $("scan").textContent="Stop checking";cur=-1;render();status();
  const todo=mine.filter(c=>!c.ok);doneN=mine.length-todo.length;let idx=0;
  const worker=async()=>{
    while(scanning&&mine===channels&&idx<todo.length){
      const c=todo[idx++];const ok=await probe(c);doneN++;
      if(ok){c.ok=true;found++;okCache[c.url]=Date.now();renderKeep()}else status();
    }
  };
  await Promise.all(Array.from({length:8},worker));
  try{localStorage.setItem(CK,JSON.stringify(okCache))}catch(e){}
  if(mine===channels){scanning=false;$("scan").textContent="Re-check channels";const keep=shown[cur];render();cur=keep?shown.indexOf(keep):-1;mark();status()}
}
$("scan").onclick=()=>{if(scanning){scanning=false}else{channels.forEach(c=>delete okCache[c.url]);runScan()}};
$("onlyok").onchange=()=>{cur=-1;render();status()};
$("vlc").onclick=()=>{
  const src=shown.length?shown:channels;
  const txt="#EXTM3U\n"+src.map(c=>"#EXTINF:-1,"+c.name+"\n"+c.url).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"audio/x-mpegurl"}));a.download="channels.m3u";a.click();
};
loadPlaylist(BASE+"pk.m3u");
if(window.Capacitor)$("vlc").style.display="none";
(function(){const s=$("splash");const t0=Date.now();
 const close=()=>{s.classList.add("hide");setTimeout(()=>s.remove(),800)};
 setTimeout(close,Math.max(0,4000-(Date.now()-t0)));
 s.addEventListener("click",close);
})();
</script>
